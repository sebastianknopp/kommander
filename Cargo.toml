[package]
name = "kommander"
version = "0.1.0"
edition = "2024"
description = "Der Kommander: a two-panel file manager for GNOME"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
