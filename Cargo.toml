[package]
name = "kommander"
version = "0.1.0"
edition = "2024"
description = "Kommander: a two-panel file manager in the GNOME Files look"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
# Not used directly (gtk::gio is the same crate); only switches on
# GIO 2.72's asynchronous move, used to restore files from the trash.
gio = { version = "0.22", features = ["v2_72"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_10", "gtk_v4_24"] }
# Channels between the copy/move worker thread and the window. Both are
# already built as part of gio, so they add nothing new to compile.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
sourceview = { version = "0.11", package = "sourceview5" }
poppler = { version = "0.26", package = "poppler-rs" }
